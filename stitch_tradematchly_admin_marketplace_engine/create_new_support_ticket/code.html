<!DOCTYPE html>

<html class="h-full bg-background dark:bg-background" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Support Ticket - TradeMatchly</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary": "#000000",
                        "tertiary-fixed": "#fcdeb5",
                        "on-surface": "#1b1b1d",
                        "surface-container-highest": "#e4e2e4",
                        "surface": "#fcf8fa",
                        "on-secondary-container": "#fffbff",
                        "surface-tint": "#565e74",
                        "on-secondary-fixed-variant": "#3323cc",
                        "on-tertiary-fixed": "#271901",
                        "on-primary-container": "#7c839b",
                        "outline": "#76777d",
                        "secondary": "#4b41e1",
                        "on-background": "#1b1b1d",
                        "on-tertiary-fixed-variant": "#574425",
                        "secondary-fixed": "#e2dfff",
                        "surface-container-high": "#eae7e9",
                        "on-primary-fixed-variant": "#3f465c",
                        "primary-fixed": "#dae2fd",
                        "on-secondary-fixed": "#0f0069",
                        "tertiary-fixed-dim": "#dec29a",
                        "inverse-surface": "#303032",
                        "primary-fixed-dim": "#bec6e0",
                        "surface-variant": "#e4e2e4",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "primary": "#000000",
                        "surface-bright": "#fcf8fa",
                        "inverse-primary": "#bec6e0",
                        "on-primary-fixed": "#131b2e",
                        "outline-variant": "#c6c6cd",
                        "surface-dim": "#dcd9db",
                        "on-secondary": "#ffffff",
                        "inverse-on-surface": "#f3f0f2",
                        "on-surface-variant": "#45464d",
                        "surface-container-low": "#f6f3f5",
                        "on-tertiary-container": "#98805d",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "primary-container": "#131b2e",
                        "error": "#ba1a1a",
                        "secondary-container": "#645efb",
                        "background": "#fcf8fa",
                        "tertiary-container": "#271901",
                        "on-error": "#ffffff",
                        "surface-container": "#f0edef",
                        "secondary-fixed-dim": "#c3c0ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "md": "16px",
                        "xl": "32px",
                        "sm": "8px",
                        "xs": "4px",
                        "lg": "24px",
                        "container-max": "1440px",
                        "base": "4px",
                        "gutter": "20px"
                    },
                    "fontFamily": {
                        "headline-md": ["Inter"],
                        "label-md": ["Inter"],
                        "data-mono": ["jetbrainsMono"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "headline-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "data-mono": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-body-md text-body-md text-on-surface antialiased bg-background h-full flex overflow-hidden">
<!-- SideNavBar (Suppressed due to form context - Task Focused) -->
<!-- TopAppBar (Suppressed due to form context - Task Focused) -->
<!-- Main Content Canvas -->
<main class="flex-1 h-full overflow-y-auto flex flex-col items-center py-xl px-gutter relative z-0">
<!-- Header -->
<header class="w-full max-w-4xl mb-xl flex items-center justify-between">
<div class="flex items-center gap-sm">
<a class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high transition-colors text-on-surface-variant" href="#">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<div>
<h1 class="font-headline-md text-headline-md text-primary">Create New Ticket</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-xs">Open a support request on behalf of a user or company.</p>
</div>
</div>
<div class="flex items-center gap-md">
<button class="px-md py-sm rounded-lg border border-outline-variant font-label-md text-label-md text-on-surface hover:bg-surface-container-low transition-colors" type="button">Save Draft</button>
</div>
</header>
<!-- Form Container -->
<form class="w-full max-w-4xl bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant/30 overflow-hidden flex flex-col">
<div class="p-lg grid grid-cols-1 md:grid-cols-2 gap-xl">
<!-- Left Column -->
<div class="flex flex-col gap-lg">
<!-- Requester -->
<div class="flex flex-col gap-sm relative">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="requester">Requester *</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-on-surface-variant z-10 pointer-events-none">search</span>
<input class="w-full pl-xl pr-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none" id="requester" name="requester" placeholder="Search user or company..." required="" type="text"/>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">Search by name, email, or company ID.</p>
</div>
<!-- Category -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="category">Ticket Category *</label>
<div class="relative">
<select class="w-full pl-sm pr-xl py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none appearance-none" id="category" name="category" required="">
<option disabled="" selected="" value="">Select a category...</option>
<option value="verification">Verification Issue</option>
<option value="payment">Payment Dispute</option>
<option value="technical">Technical Bug</option>
<option value="access">Account Access</option>
<option value="rfq">RFQ Inquiry</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Priority -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider">Priority Level *</label>
<div class="flex flex-wrap gap-xs">
<label class="relative flex-1 min-w-[80px] cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="low"/>
<div class="px-sm py-xs text-center rounded border border-outline-variant font-label-md text-label-md text-on-surface-variant peer-checked:bg-surface-container-high peer-checked:text-on-surface peer-checked:border-on-surface transition-colors">Low</div>
</label>
<label class="relative flex-1 min-w-[80px] cursor-pointer">
<input checked="" class="peer sr-only" name="priority" type="radio" value="medium"/>
<div class="px-sm py-xs text-center rounded border border-outline-variant font-label-md text-label-md text-on-surface-variant peer-checked:bg-surface-variant peer-checked:text-on-surface peer-checked:border-on-surface transition-colors">Medium</div>
</label>
<label class="relative flex-1 min-w-[80px] cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="high"/>
<div class="px-sm py-xs text-center rounded border border-outline-variant font-label-md text-label-md text-on-surface-variant peer-checked:bg-tertiary-fixed peer-checked:text-on-tertiary-fixed peer-checked:border-tertiary-container transition-colors">High</div>
</label>
<label class="relative flex-1 min-w-[80px] cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="critical"/>
<div class="px-sm py-xs text-center rounded border border-outline-variant font-label-md text-label-md text-on-surface-variant peer-checked:bg-error-container peer-checked:text-on-error-container peer-checked:border-error transition-colors">Critical</div>
</label>
</div>
</div>
<!-- Assigned Agent -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="agent">Assigned Agent</label>
<div class="relative">
<select class="w-full pl-sm pr-xl py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none appearance-none" id="agent" name="agent">
<option value="unassigned">Unassigned</option>
<option value="agent1">Sarah Jenkins (Tier 1)</option>
<option value="agent2">Marcus Chen (Tier 2)</option>
<option value="agent3">David Ross (Payments)</option>
<option value="agent4">Mei Lin (Verification)</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
<!-- Right Column -->
<div class="flex flex-col gap-lg">
<!-- Subject -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="subject">Subject *</label>
<input class="w-full px-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-md text-body-md text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none" id="subject" name="subject" placeholder="Brief summary of the issue..." required="" type="text"/>
</div>
<!-- Description (Rich Text Facsimile) -->
<div class="flex flex-col gap-sm flex-1">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="description">Description *</label>
<div class="border border-outline-variant rounded-lg bg-surface-container-lowest flex flex-col h-full overflow-hidden focus-within:border-secondary focus-within:ring-2 focus-within:ring-secondary/20 transition-all">
<!-- Toolbar -->
<div class="border-b border-outline-variant bg-surface-container-low px-xs py-xs flex gap-xs items-center">
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant transition-colors" type="button"><span class="material-symbols-outlined text-[18px]">format_bold</span></button>
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant transition-colors" type="button"><span class="material-symbols-outlined text-[18px]">format_italic</span></button>
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant transition-colors" type="button"><span class="material-symbols-outlined text-[18px]">format_list_bulleted</span></button>
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant transition-colors" type="button"><span class="material-symbols-outlined text-[18px]">link</span></button>
<div class="w-px h-4 bg-outline-variant mx-xs"></div>
<button class="w-8 h-8 flex items-center justify-center rounded hover:bg-surface-variant text-on-surface-variant transition-colors" type="button"><span class="material-symbols-outlined text-[18px]">code</span></button>
</div>
<textarea class="w-full flex-1 p-sm bg-transparent font-body-md text-body-md text-on-surface outline-none resize-none min-h-[160px]" id="description" name="description" placeholder="Provide detailed information..." required=""></textarea>
</div>
</div>
<!-- Related Entity -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider" for="entity">Related Entity (Optional)</label>
<div class="flex gap-sm">
<div class="relative w-32">
<select class="w-full pl-sm pr-xl py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-label-md text-label-md text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none appearance-none">
<option value="rfq">RFQ ID</option>
<option value="deal">Deal ID</option>
<option value="tx">Tx ID</option>
</select>
<span class="material-symbols-outlined absolute right-xs top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none text-[16px]">expand_more</span>
</div>
<input class="w-full px-sm py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-data-mono text-data-mono text-on-surface focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all outline-none" id="entity" name="entity" placeholder="e.g. TR-9821" type="text"/>
</div>
</div>
</div>
</div>
<!-- Attachments (Full Width Bottom) -->
<div class="px-lg pb-lg">
<label class="font-label-md text-label-md text-on-surface uppercase tracking-wider block mb-sm">Attachments</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl bg-surface-container-low hover:bg-surface-variant/50 transition-colors flex flex-col items-center justify-center py-xl px-md cursor-pointer group">
<div class="w-12 h-12 rounded-full bg-surface flex items-center justify-center mb-md group-hover:bg-primary-container group-hover:text-on-primary-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-primary-container transition-colors">cloud_upload</span>
</div>
<p class="font-headline-sm text-headline-sm text-on-surface text-center mb-xs">Drag and drop files here</p>
<p class="font-body-sm text-body-sm text-on-surface-variant text-center mb-md">or click to browse from your computer</p>
<p class="font-label-md text-label-md text-outline">Max 50MB per file. PNG, JPG, PDF, CSV supported.</p>
</div>
</div>
<!-- Footer Actions -->
<div class="bg-surface-container-low px-lg py-md border-t border-outline-variant flex items-center justify-between">
<button class="px-md py-sm rounded-lg font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors" type="button">Cancel</button>
<button class="px-lg py-sm rounded-lg bg-secondary text-on-secondary font-label-md text-label-md shadow-sm hover:bg-secondary-container hover:text-on-secondary-container focus:ring-2 focus:ring-secondary/20 transition-all flex items-center gap-xs" type="submit">
                    Create Ticket
                    <span class="material-symbols-outlined text-[18px]">send</span>
</button>
</div>
</form>
</main>
</body></html>

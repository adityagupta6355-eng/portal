<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>GlobalTrade - Add New Product</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "outline": "#76777d",
                        "secondary-fixed-dim": "#c3c0ff",
                        "primary": "#000000",
                        "surface-container-low": "#f2f4f6",
                        "on-tertiary-fixed": "#0b1c30",
                        "on-error": "#ffffff",
                        "surface-bright": "#f7f9fb",
                        "on-primary-fixed-variant": "#3f465c",
                        "secondary-container": "#655dfb",
                        "surface": "#f7f9fb",
                        "on-tertiary-container": "#75859d",
                        "inverse-primary": "#bec6e0",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#0b1c30",
                        "risk-red": "#dc2626",
                        "background": "#f7f9fb",
                        "tertiary": "#000000",
                        "error": "#ba1a1a",
                        "tertiary-fixed-dim": "#b7c8e1",
                        "surface-tint": "#565e74",
                        "primary-fixed": "#dae2fd",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#bec6e0",
                        "on-secondary-fixed": "#0f0069",
                        "surface-container-high": "#e6e8ea",
                        "verified-emerald": "#059669",
                        "in-progress-blue": "#2563eb",
                        "on-background": "#191c1e",
                        "on-primary-container": "#7c839b",
                        "primary-container": "#131b2e",
                        "surface-container": "#eceef0",
                        "on-secondary-container": "#fffbff",
                        "on-surface": "#191c1e",
                        "secondary": "#4b41e1",
                        "inverse-surface": "#2d3133",
                        "on-secondary-fixed-variant": "#3322cc",
                        "on-surface-variant": "#45464d",
                        "surface-dim": "#d8dadc",
                        "secondary-fixed": "#e2dfff",
                        "surface-variant": "#e0e3e5"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "stack-lg": "1.5rem",
                        "margin-mobile": "1rem",
                        "stack-sm": "0.5rem",
                        "touch-target": "2.75rem",
                        "gutter-mobile": "0.75rem",
                        "stack-md": "1rem"
                    },
                    "fontFamily": {
                        "data-mono": ["JetBrains Mono"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Inter"],

                    },
                    "fontSize": {
                        "data-mono": ["13px", { "lineHeight": "18px", "fontWeight": "500" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],

                        "label-md": ["11px", { "lineHeight": "16px", "letterSpacing": "0.06em", "fontWeight": "700" }],
                        "headline-sm": ["18px", { "lineHeight": "24px", "fontWeight": "600" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],

                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col pb-24 md:pb-0">
<!-- TopAppBar -->
<header class="bg-background flex justify-between items-center px-margin-mobile h-touch-target w-full z-40 sticky top-0 hidden md:flex border-b border-surface-border">
<div class="flex items-center gap-4">
<h1 class="text-headline-md font-headline-md font-bold text-primary">GlobalTrade</h1>
</div>
<div class="flex items-center gap-4">
<button class="h-touch-target w-touch-target flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
<span class="material-symbols-outlined">notifications</span>
</button>
<div class="h-8 w-8 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="Executive Profile" class="w-full h-full object-cover" data-alt="A professional headshot of an executive in a well-lit corporate office. They are wearing a sharp navy suit. The background is slightly blurred with soft cool-toned lighting reflecting modern corporate aesthetics." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDPVLdHqCUINlP7v2CZ3gp3AHXHqRX_U4dP8QcFuAbEOovMaAYqU1V6PPRc7tPuVkjunjG3-vCvVIp4FFARKwl4dV79TWFVz4qY2Sf13pD6QFE0MktetCw2hvuUBfQz36HMCi5tuhXuSv5XLrA3qv-3LBTaOjkT_GN7p3H5gtNtUgl3nj4mgyg3ShxAy4vPPr5Ejp83vAHaUs7QhCpZJdADjF-DgSuIzY52U4Go7VoOaBeIYwJHQk6J"/>
</div>
</div>
</header>
<!-- Mobile Header -->
<header class="md:hidden flex items-center px-margin-mobile h-touch-target bg-background sticky top-0 z-40 border-b border-surface-border">
<button class="mr-4 text-on-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-headline-sm font-headline-sm font-bold text-primary flex-1">Add New Product</h1>
</header>
<main class="flex-1 w-full max-w-3xl mx-auto px-margin-mobile md:px-0 py-stack-md flex flex-col gap-stack-lg">
<!-- Progress Indicator -->
<section class="w-full pt-4">
<div class="flex items-center justify-between mb-2">
<span class="text-label-md font-label-md text-primary">Step 1 of 4</span>
<span class="text-label-md font-label-md text-on-surface-variant">Basic Info</span>
</div>
<div class="flex gap-2">
<div class="h-1 flex-1 bg-primary rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
<div class="h-1 flex-1 bg-surface-variant rounded-full"></div>
</div>
</section>
<!-- Form Section -->
<section class="bg-surface-container-lowest rounded-xl border border-surface-border p-4 md:p-6 shadow-sm flex flex-col gap-stack-lg">
<h2 class="text-headline-sm font-headline-sm text-primary mb-2">Basic Information</h2>
<!-- Product Image Upload -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface-variant uppercase">Primary Product Image</label>
<div class="border-2 border-dashed border-outline-variant rounded-xl p-8 flex flex-col items-center justify-center text-center hover:bg-surface-container-low transition-colors cursor-pointer group">
<div class="h-12 w-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-4 group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined filled">cloud_upload</span>
</div>
<p class="text-body-md font-body-md text-primary font-medium mb-1">Click to upload or drag and drop</p>
<p class="text-body-sm font-body-sm text-on-surface-variant">SVG, PNG, JPG or GIF (max. 5MB)</p>
</div>
</div>
<!-- Product Name -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="product_name">Product Name</label>
<input class="w-full rounded-lg border border-surface-border bg-surface-container-lowest px-4 py-3 text-body-md font-body-md text-primary focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none transition-all" id="product_name" placeholder="e.g. Industrial Steel Pipe" type="text"/>
</div>
<div class="grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Category -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="category">Category</label>
<div class="relative">
<select class="w-full rounded-lg border border-surface-border bg-surface-container-lowest px-4 py-3 text-body-md font-body-md text-primary focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none transition-all appearance-none pr-10" id="category">
<option disabled="" selected="" value="">Select category</option>
<option value="raw_materials">Raw Materials</option>
<option value="machinery">Machinery &amp; Equipment</option>
<option value="electronics">Electronics</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- HS Code -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="hs_code">HS Code</label>
<button class="text-on-surface-variant hover:text-primary transition-colors" title="Harmonized System code for international shipping">
<span class="material-symbols-outlined" style="font-size: 16px;">info</span>
</button>
</div>
<input class="w-full rounded-lg border border-surface-border bg-surface-container-lowest px-4 py-3 text-data-mono font-data-mono text-primary focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none transition-all" id="hs_code" placeholder="0000.00.0000" type="text"/>
</div>
</div>
<!-- Short Description -->
<div class="flex flex-col gap-2">
<label class="text-label-md font-label-md text-on-surface-variant uppercase" for="description">Short Description</label>
<textarea class="w-full rounded-lg border border-surface-border bg-surface-container-lowest px-4 py-3 text-body-md font-body-md text-primary focus:border-secondary focus:ring-2 focus:ring-secondary/20 outline-none transition-all resize-none" id="description" placeholder="Briefly describe the key features and specifications of this product..." rows="4"></textarea>
<div class="text-right">
<span class="text-body-sm font-body-sm text-on-surface-variant">0/250</span>
</div>
</div>
</section>
</main>
<!-- Sticky Bottom Action Bar -->
<div class="fixed bottom-0 md:bottom-auto md:relative w-full max-w-3xl mx-auto bg-surface-container-lowest border-t border-surface-border p-4 z-40">
<button class="w-full md:w-auto md:float-right bg-primary text-on-primary py-3 px-6 rounded-lg text-headline-sm font-headline-sm font-semibold hover:bg-opacity-90 transition-opacity flex items-center justify-center gap-2 touch-manipulation min-h-[44px]">
            Next Step
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</body></html>

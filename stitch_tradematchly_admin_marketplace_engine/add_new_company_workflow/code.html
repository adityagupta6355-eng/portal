<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>TradeMatchly Admin - Add New Company</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#fcf8fa",
                        "on-secondary-fixed-variant": "#3323cc",
                        "on-secondary-fixed": "#0f0069",
                        "primary-fixed": "#dae2fd",
                        "surface-variant": "#e4e2e4",
                        "on-tertiary-container": "#98805d",
                        "primary-fixed-dim": "#bec6e0",
                        "secondary-fixed": "#e2dfff",
                        "surface-dim": "#dcd9db",
                        "on-primary-fixed-variant": "#3f465c",
                        "background": "#fcf8fa",
                        "surface-bright": "#fcf8fa",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#c3c0ff",
                        "inverse-surface": "#303032",
                        "tertiary-fixed-dim": "#dec29a",
                        "inverse-on-surface": "#f3f0f2",
                        "on-surface-variant": "#45464d",
                        "on-secondary": "#ffffff",
                        "tertiary-container": "#271901",
                        "secondary-container": "#645efb",
                        "secondary": "#4b41e1",
                        "on-background": "#1b1b1d",
                        "surface-container": "#f0edef",
                        "outline": "#76777d",
                        "on-tertiary-fixed-variant": "#574425",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#fffbff",
                        "surface-container-low": "#f6f3f5",
                        "outline-variant": "#c6c6cd",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#bec6e0",
                        "primary": "#000000",
                        "on-error": "#ffffff",
                        "surface-container-high": "#eae7e9",
                        "surface-tint": "#565e74",
                        "primary-container": "#131b2e",
                        "tertiary": "#000000",
                        "on-error-container": "#93000a",
                        "on-primary": "#ffffff",
                        "on-tertiary-fixed": "#271901",
                        "on-primary-fixed": "#131b2e",
                        "surface-container-highest": "#e4e2e4",
                        "tertiary-fixed": "#fcdeb5",
                        "on-primary-container": "#7c839b",
                        "on-surface": "#1b1b1d",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xs": "4px",
                        "base": "4px",
                        "lg": "24px",
                        "md": "16px",
                        "gutter": "20px",
                        "sm": "8px",
                        "xl": "32px",
                        "container-max": "1440px"
                    },
                    "fontFamily": {
                        "headline-sm": ["Inter"],
                        "data-mono": ["JetBrains Mono"],
                        "label-md": ["Inter"],
                        "headline-md": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "body-sm": ["Inter"]
                    },
                    "fontSize": {
                        "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }],
                        "data-mono": ["13px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "display-lg": ["36px", { "lineHeight": "44px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .custom-input {
            border-color: #cbd5e1;
            transition: all 0.2s ease-in-out;
        }
        .custom-input:focus {
            border-color: #4b41e1;
            box-shadow: 0 0 0 2px rgba(75, 65, 225, 0.2);
            outline: none;
        }
        .step-active {
            border-color: #4b41e1;
            color: #4b41e1;
        }
        .step-completed {
            border-color: #4b41e1;
            background-color: #4b41e1;
            color: #ffffff;
        }
        .step-inactive {
            border-color: #c6c6cd;
            color: #45464d;
        }
        .line-active {
            background-color: #4b41e1;
        }
        .line-inactive {
            background-color: #c6c6cd;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased flex">
<!-- SideNavBar (Suppressed due to Linear/Transactional intent, but kept here for context if needed, though instructions say: Automatic Suppression: You MUST exclude the navigation shell if the page intent is Linear/Transactional: Login, Sign-up, Onboarding...) -->
<!-- So we suppress TopNav and SideNav for this focused form -->
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col min-h-screen">
<!-- Header / Close Action -->
<header class="w-full flex justify-between items-center px-lg py-md sticky top-0 z-40 bg-surface-container-lowest border-b border-outline-variant/30 shadow-sm">
<div class="flex items-center gap-sm">
<a class="p-2 hover:bg-surface-container-low rounded-full transition-colors group" href="#">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-primary transition-colors">close</span>
</a>
<h1 class="font-headline-sm text-headline-sm text-primary tracking-tight">Add New Company</h1>
</div>
<button class="font-label-md text-label-md text-on-surface-variant hover:text-primary transition-colors" type="button">Cancel</button>
</header>
<!-- Centered Container -->
<div class="flex-1 overflow-y-auto w-full px-4 py-xl md:py-16">
<div class="max-w-3xl mx-auto space-y-xl">
<!-- Stepper Progress -->
<div class="w-full px-4 mb-12">
<div class="flex items-center justify-between relative">
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-[2px] bg-outline-variant -z-10 rounded-full"></div>
<div class="absolute left-0 top-1/2 -translate-y-1/2 w-1/3 h-[2px] bg-secondary -z-10 rounded-full transition-all duration-500"></div>
<!-- Step 1 (Active) -->
<div class="flex flex-col items-center gap-sm relative z-10 bg-surface px-2">
<div class="w-8 h-8 rounded-full flex items-center justify-center font-label-md text-label-md border-2 step-active bg-surface">
                                1
                            </div>
<span class="font-label-md text-label-md text-secondary absolute top-10 whitespace-nowrap">Basic Info</span>
</div>
<!-- Step 2 -->
<div class="flex flex-col items-center gap-sm relative z-10 bg-surface px-2">
<div class="w-8 h-8 rounded-full flex items-center justify-center font-label-md text-label-md border-2 step-inactive bg-surface">
                                2
                            </div>
<span class="font-label-md text-label-md text-on-surface-variant absolute top-10 whitespace-nowrap">Contact</span>
</div>
<!-- Step 3 -->
<div class="flex flex-col items-center gap-sm relative z-10 bg-surface px-2">
<div class="w-8 h-8 rounded-full flex items-center justify-center font-label-md text-label-md border-2 step-inactive bg-surface">
                                3
                            </div>
<span class="font-label-md text-label-md text-on-surface-variant absolute top-10 whitespace-nowrap">Trade Profile</span>
</div>
<!-- Step 4 -->
<div class="flex flex-col items-center gap-sm relative z-10 bg-surface px-2">
<div class="w-8 h-8 rounded-full flex items-center justify-center font-label-md text-label-md border-2 step-inactive bg-surface">
                                4
                            </div>
<span class="font-label-md text-label-md text-on-surface-variant absolute top-10 whitespace-nowrap">Verification</span>
</div>
</div>
</div>
<!-- Form Card -->
<div class="bg-surface-container-lowest rounded-xl shadow-sm border border-outline-variant p-lg md:p-xl mt-8">
<div class="mb-lg">
<h2 class="font-headline-md text-headline-md text-primary">Basic Information</h2>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">Provide the legal identity and core details of the new entity.</p>
</div>
<form class="space-y-lg">
<!-- Legal Name & Reg Number -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="legalName">Legal Company Name</label>
<input class="custom-input bg-surface-container-low border rounded-lg px-3 py-2 w-full font-body-md text-body-md" id="legalName" placeholder="e.g. Acme Corporation Ltd." type="text"/>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="regNumber">Registration Number</label>
<input class="custom-input bg-surface-container-low border rounded-lg px-3 py-2 w-full font-data-mono text-data-mono" id="regNumber" placeholder="e.g. 1234567890" type="text"/>
</div>
</div>
<!-- Country & Website -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="country">Country of Registration</label>
<select class="custom-input bg-surface-container-low border rounded-lg px-3 py-2 w-full font-body-md text-body-md appearance-none" id="country">
<option disabled="" selected="" value="">Select a country...</option>
<option value="US">United States</option>
<option value="UK">United Kingdom</option>
<option value="DE">Germany</option>
<option value="SG">Singapore</option>
</select>
</div>
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface" for="website">Company Website</label>
<div class="relative flex items-center">
<span class="absolute left-3 text-on-surface-variant font-data-mono text-data-mono">https://</span>
<input class="custom-input bg-surface-container-low border rounded-lg pl-16 pr-3 py-2 w-full font-body-md text-body-md" id="website" placeholder="www.example.com" type="text"/>
</div>
</div>
</div>
<!-- Business Type -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface">Business Type</label>
<div class="grid grid-cols-1 sm:grid-cols-3 gap-sm">
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-4 focus-within:ring-2 focus-within:ring-secondary focus-within:border-secondary hover:bg-surface-container-low transition-colors">
<input class="sr-only" name="businessType" type="radio" value="buyer"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">shopping_cart</span>
<span class="font-label-md text-label-md text-on-surface">Buyer</span>
</div>
<div class="w-4 h-4 rounded-full border border-outline-variant flex items-center justify-center peer-checked:border-secondary peer-checked:bg-secondary">
<!-- Check state handled via CSS/JS ideally, simple visual here -->
</div>
</div>
</label>
<label class="relative flex cursor-pointer rounded-lg border border-secondary bg-surface-container-low p-4 ring-1 ring-secondary shadow-sm transition-colors">
<input checked="" class="sr-only" name="businessType" type="radio" value="supplier"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary">inventory_2</span>
<span class="font-label-md text-label-md text-primary">Supplier</span>
</div>
<div class="w-4 h-4 rounded-full border-2 border-secondary bg-secondary flex items-center justify-center">
<div class="w-1.5 h-1.5 rounded-full bg-white"></div>
</div>
</div>
</label>
<label class="relative flex cursor-pointer rounded-lg border border-outline-variant bg-surface-container-lowest p-4 focus-within:ring-2 focus-within:ring-secondary focus-within:border-secondary hover:bg-surface-container-low transition-colors">
<input class="sr-only" name="businessType" type="radio" value="both"/>
<div class="flex items-center justify-between w-full">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-on-surface-variant">sync_alt</span>
<span class="font-label-md text-label-md text-on-surface">Both</span>
</div>
<div class="w-4 h-4 rounded-full border border-outline-variant flex items-center justify-center">
</div>
</div>
</label>
</div>
</div>
</form>
<!-- Footer Actions -->
<div class="mt-xl pt-lg border-t border-outline-variant/30 flex justify-end gap-md">
<button class="px-4 py-2 font-label-md text-label-md rounded-lg border border-outline-variant text-on-surface bg-surface-container-lowest hover:bg-surface-container-low transition-colors shadow-sm" type="button">
                            Back
                        </button>
<button class="px-6 py-2 font-label-md text-label-md rounded-lg bg-secondary text-on-secondary hover:bg-on-secondary-fixed transition-colors shadow-sm flex items-center gap-sm" type="button">
                            Next Step
                            <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
</div>
</div>
</div>
</main>
</body></html>
